# Railway's edge reaches the container from 100.64.0.0/10 and overwrites any
# client-supplied X-Forwarded-For, so the leftmost entry of the incoming header is
# the real visitor. Discourse's bundled nginx config sends `X-Forwarded-For
# $remote_addr`, which here is the edge — every visitor would then share one
# per-IP rate-limit bucket and every log line would show a Railway address.
map $http_x_forwarded_for $real_client_ip {
  '~^\s*(?P<first>[^,\s]+)' $first;
  default $remote_addr;
}
